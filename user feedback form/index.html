<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f9;
      margin: 0;
      display: flex;
      justify-content: center;
      padding: 40px 10px;
    }

    .form-container {
      background: #ffffff;
      width: 500px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-top: 6px solid #673ab7;
    }

    h2 {
      margin-top: 0;
      color: #202124;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #202124;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #673ab7;
    }

    .options {
      margin-top: 5px;
    }

    .options input {
      width: auto;
      margin-right: 5px;
    }

    .options label {
      display: inline;
      font-weight: normal;
      margin-right: 15px;
    }

    button {
      margin-top: 20px;
      background: #673ab7;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5a2ea6;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>📝 Feedback Form</h2>

  <form>

    <label>Full Name</label>
    <input type="text" required>

    <label>Email Address</label>
    <input type="email" required>

    <label>Rate Your Experience</label>
    <div class="options">
      <input type="radio" name="rating"> <label>Excellent</label>
      <input type="radio" name="rating"> <label>Good</label>
      <input type="radio" name="rating"> <label>Average</label>
      <input type="radio" name="rating"> <label>Poor</label>
    </div>

    <label>Your Feedback</label>
    <textarea rows="4" required></textarea>

    <label>Services Used</label>
    <div class="options">
      <input type="checkbox"> <label>Website</label>
      <input type="checkbox"> <label>Mobile App</label>
      <input type="checkbox"> <label>Support</label>
    </div>

    <label>Would you recommend us?</label>
    <select>
      <option>Yes</option>
      <option>Maybe</option>
      <option>No</option>
    </select>

    <button type="submit">Submit</button>

  </form>
</div>

</body>
</html>
