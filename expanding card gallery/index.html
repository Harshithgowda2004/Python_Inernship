<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expanding Cards</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #111;
    }

    .container {
      display: flex;
      width: 90vw;
    }

    .panel {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 80vh;
      border-radius: 20px;
      color: #fff;
      cursor: pointer;
      flex: 0.5;
      margin: 10px;
      position: relative;
      transition: flex 0.5s ease-in;
    }

    .panel h3 {
      font-size: 24px;
      position: absolute;
      bottom: 20px;
      left: 20px;
      margin: 0;
      opacity: 0;
      transition: opacity 0.3s ease-in 0.4s;
    }

    .panel.active {
      flex: 5;
    }

    .panel.active h3 {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .container {
        width: 100vw;
      }

      .panel:nth-of-type(4),
      .panel:nth-of-type(5) {
        display: none;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="panel active" style="background-image: url('https://picsum.photos/id/1015/800/600');">
    <h3>Mountains</h3>
  </div>
  <div class="panel" style="background-image: url('https://picsum.photos/id/1016/800/600');">
    <h3>Forest</h3>
  </div>
  <div class="panel" style="background-image: url('https://picsum.photos/id/1018/800/600');">
    <h3>Ocean</h3>
  </div>
  <div class="panel" style="background-image: url('https://picsum.photos/id/1020/800/600');">
    <h3>Desert</h3>
  </div>
  <div class="panel" style="background-image: url('https://picsum.photos/id/1024/800/600');">
    <h3>City</h3>
  </div>
</div>

<script>
  const panels = document.querySelectorAll('.panel');

  panels.forEach(panel => {
    panel.addEventListener('click', () => {
      removeActiveClasses();
      panel.classList.add('active');
    });
  });

  function removeActiveClasses() {
    panels.forEach(panel => {
      panel.classList.remove('active');
    });
  }
</script>

</body>
</html>
