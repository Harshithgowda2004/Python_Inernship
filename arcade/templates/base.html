<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ARCADE{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --neon-pink:#ff2d78;
  --neon-cyan:#00f5ff;
  --neon-yellow:#ffe600;
  --neon-purple:#bf00ff;
  --dark:#080818;
  --dark2:#0d0d2b;
  --card:#111130;
  --border:#1e1e4a;
  --text:#e0e0ff;
  --muted:#5555aa;
  --font-head:'Orbitron',sans-serif;
  --font-body:'Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:var(--font-body);font-size:16px}

/* Animated grid bg */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,245,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.04) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* NAV */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 32px;
  background:rgba(8,8,24,.85);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.logo{
  font-family:var(--font-head);font-size:1.4rem;font-weight:900;
  color:var(--neon-cyan);
  text-shadow:0 0 20px var(--neon-cyan);
  letter-spacing:4px;
  text-decoration:none;
}
.logo span{color:var(--neon-pink);text-shadow:0 0 20px var(--neon-pink)}
.nav-links{display:flex;gap:20px;align-items:center}
.nav-links a{
  color:var(--muted);font-family:var(--font-body);font-weight:600;
  text-decoration:none;font-size:.95rem;letter-spacing:1px;
  transition:color .2s;
}
.nav-links a:hover{color:var(--neon-cyan)}
.nav-user{color:var(--neon-yellow);font-weight:600;font-size:.9rem;letter-spacing:1px}

/* BUTTONS */
.btn{
  display:inline-block;padding:10px 28px;
  font-family:var(--font-head);font-size:.8rem;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;text-decoration:none;
  border:none;cursor:pointer;transition:all .2s;border-radius:4px;
}
.btn-cyan{
  background:transparent;color:var(--neon-cyan);
  border:1px solid var(--neon-cyan);
  box-shadow:0 0 10px rgba(0,245,255,.2);
}
.btn-cyan:hover{background:var(--neon-cyan);color:var(--dark);box-shadow:0 0 25px var(--neon-cyan)}
.btn-pink{
  background:transparent;color:var(--neon-pink);
  border:1px solid var(--neon-pink);
  box-shadow:0 0 10px rgba(255,45,120,.2);
}
.btn-pink:hover{background:var(--neon-pink);color:#fff;box-shadow:0 0 25px var(--neon-pink)}
.btn-yellow{
  background:var(--neon-yellow);color:var(--dark);
  border:1px solid var(--neon-yellow);font-weight:900;
}
.btn-yellow:hover{box-shadow:0 0 30px var(--neon-yellow);transform:translateY(-2px)}

/* CARDS */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  padding:28px;
}
.card-glow-cyan{box-shadow:0 0 30px rgba(0,245,255,.08),inset 0 0 30px rgba(0,245,255,.02)}
.card-glow-pink{box-shadow:0 0 30px rgba(255,45,120,.08),inset 0 0 30px rgba(255,45,120,.02)}

/* FORMS */
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.8rem;letter-spacing:2px;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
.form-group input{
  width:100%;padding:12px 16px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:4px;color:var(--text);
  font-family:var(--font-body);font-size:1rem;
  transition:border-color .2s;
}
.form-group input:focus{outline:none;border-color:var(--neon-cyan);box-shadow:0 0 12px rgba(0,245,255,.15)}
.error-msg{color:var(--neon-pink);font-size:.85rem;margin-bottom:14px;letter-spacing:1px}

/* NEON text helpers */
.glow-cyan{color:var(--neon-cyan);text-shadow:0 0 15px var(--neon-cyan)}
.glow-pink{color:var(--neon-pink);text-shadow:0 0 15px var(--neon-pink)}
.glow-yellow{color:var(--neon-yellow);text-shadow:0 0 15px var(--neon-yellow)}

/* Score toast */
#score-toast{
  position:fixed;bottom:30px;right:30px;z-index:999;
  background:var(--card);border:1px solid var(--neon-yellow);
  color:var(--neon-yellow);padding:14px 24px;
  font-family:var(--font-head);font-size:.85rem;letter-spacing:2px;
  border-radius:6px;box-shadow:0 0 25px rgba(255,230,0,.3);
  transform:translateY(80px);opacity:0;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
}
#score-toast.show{transform:translateY(0);opacity:1}

{% block extra_style %}{% endblock %}
</style>
</head>
<body>
<div class="page">

{% if session.get('user') %}
<nav>
  <a href="/dashboard" class="logo">PIXEL<span>ARCADE</span></a>
  <div class="nav-links">
    <a href="/dashboard">Dashboard</a>
    <a href="/game/guess">Guess</a>
    <a href="/game/quiz">Quiz</a>
    <a href="/game/tictactoe">Tic-Tac-Toe</a>
    <a href="/game/snake">Snake</a>
    <a href="/game/memory">Memory</a>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <span class="nav-user">{{ session['user'] }}</span>
    <a href="/logout" class="btn btn-pink" style="padding:6px 16px;font-size:.7rem">Logout</a>
  </div>
</nav>
{% endif %}

<div id="score-toast">+<span id="toast-pts">0</span> PTS!</div>

{% block content %}{% endblock %}
</div>

<script>
function awardPoints(pts){
  fetch('/api/score',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({points:pts})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){
      document.getElementById('toast-pts').textContent=pts;
      const t=document.getElementById('score-toast');
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),2500);
    }
  });
}
{% block extra_script %}{% endblock %}
</script>
</body>
</html>
